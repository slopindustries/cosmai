# Generated by `addon_kit new collector.naver.blog --kind collector` from
# addon_kit/template/addon.toml. Replace the example fields below with what this
# add-on actually needs; see addon_kit/template/README.md for what each section
# means and what the collector kind may and may not declare (DP-008 D4).

[addon]
id = "collector.naver.blog"
version = "0.1.0"
kind = "collector"
entry = "handler:run"
requires_contract = ">=1.0,<2.0"


[config]
schema_version = "1"

[[config.field]]
name = "base_path"
type = "string"
required = true
label = "Endpoint path"
help = "Path appended to the source's base URL, e.g. /v1/items"

[[config.field]]
name = "api_token"
type = "string"
required = true
secret = true
label = "API token"
help = "Routed to the secret store; this add-on never receives the value (DP-008 D6)"

[[config.field]]
name = "page_size"
type = "integer"
required = false
label = "Page size"
help = "Records requested per page; omit to use the source's own default"

[declares]
hosts = ["api.example.com"]
endpoints = ["/v1/items"]
streams = ["items"]
needs_credential = true
