# collector.naver.blog — Naver API Hub blog search collector.
#
# Sources for the shape below:
#   https://api.ncloud-docs.com/docs/naver-api-hub-search-blog (endpoint, params, response, errors)
#   https://guide.ncloud-docs.com/docs/apihub-overview (RPS limiting, auth headers, quotas)
# both fetched 2026-08-18. See handler.py for the assumptions the docs leave open.

[addon]
id = "collector.naver.blog"
version = "0.1.0"
kind = "collector"
entry = "handler:run"
requires_contract = ">=1.0,<2.0"

[config]
schema_version = "1"

[[config.field]]
name = "query"
type = "string"
required = true
label = "Search query"
help = "UTF-8 search term, sent as the API's required `query` parameter"

[[config.field]]
name = "display"
type = "integer"
required = false
label = "Results per page"
help = "Sent as `display`. The API accepts 1-100 and defaults to 10; out-of-range is rejected here before any request is made, since [config.field] has no range type to enforce it"

[[config.field]]
name = "sort"
type = "string"
required = false
label = "Sort order"
help = "Sent as `sort`. The API accepts only \"sim\" (relevance, default) or \"date\"; there is no enum field type, so this is enforced in code, not by the schema"

# `[측정]` `client_id` and `client_secret` were declared here as `required`, `secret`
# config fields until 2026-08-18, with a note saying the pairing of two secrets to two
# headers was a guess because the contract had no vocabulary for it. DP-018 gave it one:
# the parts live in the **source's outbound profile**, which the operator approves, and
# `needs_credential` below stays as the add-on's *request* for one. The fields are removed
# rather than left in place, because a `required` field that can never be configured and
# that this add-on never receives is a declaration nothing can satisfy or check.

[declares]
hosts = ["naverapihub.apigw.ntruss.com"]
endpoints = ["blog"]
streams = ["items"]
needs_credential = true
