# collector.naver.blog — Naver API Hub blog search collector.
#
# Sources for the shape below:
#   https://api.ncloud-docs.com/docs/naver-api-hub-search-blog (endpoint, params, response, errors)
#   https://guide.ncloud-docs.com/docs/apihub-overview (RPS limiting, auth headers, quotas)
# both fetched 2026-08-18. See handler.py for the assumptions the docs leave open.

[addon]
id = "collector.naver.blog"
version = "0.1.0"
kind = "collector"
entry = "handler:run"
requires_contract = ">=1.0,<2.0"

[config]
schema_version = "1"

[[config.field]]
name = "query"
type = "string"
required = true
label = "Search query"
help = "UTF-8 search term, sent as the API's required `query` parameter"

[[config.field]]
name = "display"
type = "integer"
required = false
label = "Results per page"
help = "Sent as `display`. The API accepts 1-100 and defaults to 10; out-of-range is rejected here before any request is made, since [config.field] has no range type to enforce it"

[[config.field]]
name = "sort"
type = "string"
required = false
label = "Sort order"
help = "Sent as `sort`. The API accepts only \"sim\" (relevance, default) or \"date\"; there is no enum field type, so this is enforced in code, not by the schema"

# `client_id` and `client_secret` cover the two values the API's auth requires
# (X-NCP-APIGW-API-KEY-ID and X-NCP-APIGW-API-KEY). `needs_credential` below is a
# single boolean with no way to say "two named secrets map to two named headers" —
# see handler.py's module docstring for why this pairing is a guess rather than a
# read fact.
[[config.field]]
name = "client_id"
type = "string"
required = true
secret = true
label = "NCP Client ID"
help = "Routed to the secret store; sent by the platform as X-NCP-APIGW-API-KEY-ID. This add-on never receives the value (DP-008 D6)"

[[config.field]]
name = "client_secret"
type = "string"
required = true
secret = true
label = "NCP Client Secret"
help = "Routed to the secret store; sent by the platform as X-NCP-APIGW-API-KEY. This add-on never receives the value (DP-008 D6)"

[declares]
hosts = ["naverapihub.apigw.ntruss.com"]
endpoints = ["blog"]
streams = ["items"]
needs_credential = true
