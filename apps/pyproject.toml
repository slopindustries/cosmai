[project]
name = "cosmai-apps"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = [
    "psycopg[binary]>=3.2",
    "fastapi>=0.115",
    "uvicorn>=0.34",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-xdist>=3.6",
    "mypy>=1.14",
    "ruff>=0.9",
    "httpx>=0.28",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
strict = true
# `addons/` is excluded for the same reason the repository-root pyproject.toml
# excludes `experiments/integrated-p0/addons/` (see that file and
# docs/conventions/addon-authoring.md): every add-on's entry file is
# conventionally `handler.py`, and add-ons are independent roots loaded by path
# rather than imported by name (DP-008 D2), so two of them collide in mypy's
# single module namespace — "Duplicate module named handler" — the moment a
# second add-on exists under this directory. Check one add-on at a time by
# naming its files explicitly, e.g.:
#   uv run mypy --strict addons/<addon-id>/handler.py
exclude = ["^addons/"]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
