[project]
name = "cosmai"
version = "0.0.0"
description = "Cosmai development environment. Intentionally defines no importable package."
requires-python = ">=3.13"
dependencies = []

# This project is a tooling manifest, not a package. Nothing here is importable,
# so no P0 module can become a runtime or package dependency of P1.
# See docs/decisions/DP-003-development-environment.md.
[tool.uv]
package = false

[dependency-groups]
dev = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "mypy>=1.14",
    "psycopg[binary]>=3.2",
    "pytest>=8.3",
    "pytest-xdist>=3.6",
    "ruff>=0.9",
    "uvicorn>=0.34",
]

[tool.pytest.ini_options]
# Executable P0-A tests live beside the code they test, under the experiment root,
# because they are disposable P0 code rather than the promotable scenario documents
# and repository checks that `tests/` holds. See DP-006 D1 and tests/README.md.
testpaths = ["tests", "experiments/integrated-p0/tests"]
# `experiments/integrated-p0` is on the path because its directory name contains a
# hyphen and is therefore not importable as a package. The disposable P0 modules
# under it are reached only through this entry, never through an installed package.
pythonpath = [".", "experiments/integrated-p0"]
addopts = "--strict-markers -ra"
markers = [
    "requires_credential: needs a real credential; skipped unless --run-credential is given",
    "network: performs an outbound request; skipped unless --run-network is given",
    "concurrency: runs multiple worker processes against one database",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [".venv", "var", "experiments/integrated-p0/dashboard"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
# The same entry `pythonpath` gives pytest, for the same reason: the experiment
# directory's name contains a hyphen and is not importable as a package, so
# `platform_core`, `addon_api`, `domain`, and an add-on under `addons/` are reached
# through this path and never through an installed distribution.
#
# Without it, checking one add-on on its own — which is what an add-on author does,
# and what `docs/conventions/addon-authoring.md` tells them to do — fails to resolve
# `addon_api` even though checking the whole tree succeeds. A tool that only works
# when you point it at everything is not the loop the add-on layer is for.
mypy_path = "experiments/integrated-p0"
# `var/` is ignored runtime state — a local PostgreSQL cluster, logs, and a
# relocated tool cache. It holds no project source. Mirrors the ruff exclusion.
#
# `addons/` is excluded for a different reason and not because it is unchecked.
# Every add-on's entry file is conventionally `handler.py`, and add-ons are
# deliberately independent roots loaded by path rather than imported by name
# (DP-008 D2), so two of them collide in mypy's single module namespace:
# "Duplicate module named handler". Each add-on is checked on its own by
# `scripts/check-addons.sh`, which is the invocation the layout actually means.
exclude = ["^var/", "^experiments/integrated-p0/addons/"]
